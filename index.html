<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Небесный дрифт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Russo+One&display=swap">
<style>
/* Layout: full-bleed WebGL scene; glass HUD pinned to the top, thumb pads pinned to the bottom corners. */
:root {
  --ink: #0c1630;
  --sun: #ffb24a;
  --sky: #8fc4ff;
  --glass: rgba(12, 22, 48, 0.38);
  --line: rgba(255, 255, 255, 0.6);
  --hot: #ff4d5e;
  --white: #ffffff;
  --display: 'Russo One', 'Arial Black', Impact, sans-serif;
  --body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--white);
  font-family: var(--body);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }

#hud {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: 12px 16px 0; pointer-events: none;
  text-shadow: 0 1px 6px rgba(8, 20, 50, 0.55);
}
.stat { display: flex; flex-direction: column; min-width: 0; }
.stat.right { align-items: flex-end; }
.lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; }
.num { font-family: var(--display); font-size: clamp(26px, 7vw, 40px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.num small { font-size: 0.42em; letter-spacing: 0.06em; margin-left: 4px; opacity: 0.9; }
.best { font-size: 12px; font-weight: 700; opacity: 0.9; font-variant-numeric: tabular-nums; }

#chainBox {
  position: absolute; top: clamp(70px, 14vh, 110px); left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  pointer-events: none; opacity: 0; transition: opacity 0.2s;
  text-shadow: 0 2px 10px rgba(8, 20, 50, 0.6);
}
#chainBox.on { opacity: 1; }
#chain { font-family: var(--display); font-size: clamp(30px, 9vw, 54px); color: var(--sun); font-variant-numeric: tabular-nums; }
#mult { font-family: var(--display); font-size: 16px; letter-spacing: 0.08em; }
#angWrap { width: min(220px, 56vw); height: 6px; background: rgba(255, 255, 255, 0.28); border-radius: 3px; overflow: hidden; }
#angbar { height: 100%; width: 0; background: var(--sun); border-radius: 3px; }

#toast {
  position: absolute; top: 38%; left: 50%; transform: translate(-50%, 0);
  font-family: var(--display); font-size: clamp(24px, 7vw, 42px); white-space: nowrap;
  opacity: 0; pointer-events: none; text-shadow: 0 2px 12px rgba(8, 20, 50, 0.7);
}
#toast.bank { color: var(--sun); }
#toast.crash { color: var(--hot); }
#toast.show { animation: pop 1.3s ease-out forwards; }
@keyframes pop {
  0% { opacity: 0; transform: translate(-50%, 10px) scale(0.85); }
  15% { opacity: 1; transform: translate(-50%, 0) scale(1.05); }
  70% { opacity: 1; transform: translate(-50%, -8px) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -26px) scale(1); }
}

#tools {
  position: absolute; top: calc(clamp(26px, 7vw, 40px) + 62px); right: 16px;
  display: flex; flex-direction: column; gap: 8px;
}
.tool {
  width: 40px; height: 40px; border-radius: 12px; padding: 0;
  background: var(--glass); border: 1.5px solid var(--line); color: var(--white);
  display: grid; place-items: center; cursor: pointer; font-family: var(--body);
}
.tool svg { width: 20px; height: 20px; }
.tool[aria-pressed="false"] { opacity: 0.55; }
.tool:focus-visible, .pad:focus-visible, #go:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

#pads {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: space-between; align-items: flex-end; gap: 10px;
  padding: 0 16px 16px;
}
.group { display: flex; gap: 10px; align-items: flex-end; }
.col { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.pad {
  --s: clamp(66px, 19vmin, 92px);
  width: var(--s); height: var(--s); border-radius: 24px; padding: 0;
  background: var(--glass); border: 2px solid var(--line); color: var(--white);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-family: var(--body); font-weight: 700; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  touch-action: none; cursor: pointer; transition: background 0.08s, transform 0.08s;
}
.pad svg { width: 30px; height: 30px; }
.pad.gas { --s: clamp(80px, 23vmin, 108px); }
.pad.small { --s: auto; width: auto; height: 40px; flex-direction: row; padding: 0 16px; border-radius: 20px; gap: 8px; }
.pad.small svg { width: 18px; height: 18px; }
.pad.on { background: rgba(255, 178, 74, 0.78); transform: scale(0.95); border-color: #fff; color: var(--ink); }

#start {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
  background: linear-gradient(180deg, rgba(12, 22, 48, 0.25), rgba(12, 22, 48, 0.6));
}
#start[hidden] { display: none; }
.card { max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 14px; text-align: center; align-items: center; }
.card h1 { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 11vw, 64px); line-height: 1; margin: 0; text-wrap: balance; text-shadow: 0 3px 18px rgba(8, 20, 50, 0.6); }
.card h1 span { color: var(--sun); }
.card p { margin: 0; font-size: 15px; line-height: 1.5; max-width: 34ch; text-shadow: 0 1px 8px rgba(8, 20, 50, 0.7); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; text-align: left; font-size: 13px; background: var(--glass); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 16px; }
.keys b { font-family: var(--display); font-weight: 400; color: var(--sun); letter-spacing: 0.04em; }
#go {
  font-family: var(--display); font-size: 20px; letter-spacing: 0.06em; color: var(--ink);
  background: var(--sun); border: 0; border-radius: 16px; padding: 14px 40px; cursor: pointer; touch-action: manipulation;
}
#go:active { transform: scale(0.97); }
#fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
@media (prefers-reduced-motion: reduce) {
  #toast.show { animation: none; opacity: 1; }
  .pad { transition: none; }
}
@media (max-height: 430px) {
  #chainBox { top: 52px; }
  .keys { display: none; }
}
</style>

<div id="app">
  <div id="hud">
    <div class="stat">
      <span class="lbl">Скорость</span>
      <span class="num"><span id="spd">0</span><small>км/ч</small></span>
    </div>
    <div class="stat right">
      <span class="lbl">Очки</span>
      <span class="num" id="score">0</span>
      <span class="best">Рекорд <span id="best">0</span></span>
    </div>
  </div>

  <div id="chainBox">
    <div id="chain">0</div>
    <div id="mult">x1.0</div>
    <div id="angWrap"><div id="angbar"></div></div>
  </div>
  <div id="toast"></div>

  <div id="tools">
    <button class="tool" id="tSound" aria-pressed="true" aria-label="Звук" title="Звук">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
    </button>
    <button class="tool" id="tAuto" aria-pressed="false" aria-label="Автогаз" title="Автогаз">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 12l5-5"/><path d="M17 3v4h4"/></svg>
    </button>
    <button class="tool" id="tColor" aria-label="Сменить цвет машины" title="Цвет">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c5 5 7 8 7 11a7 7 0 0 1-14 0c0-3 2-6 7-11z"/></svg>
    </button>
    <button class="tool" id="tReset" aria-label="Вернуть машину на старт" title="На старт">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </div>

  <div id="pads">
    <div class="group">
      <button class="pad" data-k="left" aria-label="Руль влево">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,4 7,12 15,20"/></svg>
      </button>
      <button class="pad" data-k="right" aria-label="Руль вправо">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9,4 17,12 9,20"/></svg>
      </button>
    </div>
    <div class="col">
      <button class="pad small" data-k="brake" aria-label="Тормоз и задний ход">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,9 12,16 19,9"/></svg>Тормоз
      </button>
      <div class="group">
        <button class="pad" data-k="hand" aria-label="Ручник, дрифт">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c0-8 6-6 8-10s6-4 8-6"/><path d="M9 21c1-6 6-5 8-9"/></svg>
          Дрифт
        </button>
        <button class="pad gas" data-k="gas" aria-label="Газ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,15 12,6 19,15"/><polyline points="5,21 12,12 19,21"/></svg>
          Газ
        </button>
      </div>
    </div>
  </div>

  <div id="start">
    <div class="card">
      <h1>Небесный <span>дрифт</span></h1>
      <p>Разгонись, брось машину в занос и держи угол как можно дольше. Конусы и стена сбрасывают серию.</p>
      <div class="keys">
        <b>Телефон</b><span>стрелки слева, газ и дрифт справа</span>
        <b>Клавиши</b><span>WASD или стрелки, пробел для дрифта</span>
      </div>
      <button id="go">Поехали</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  if (!window.THREE) {
    app.innerHTML = '<div id="fail">Не удалось загрузить 3D-движок. Проверь соединение и открой страницу заново.</div>';
    return;
  }
  var $ = function (s) { return document.querySelector(s); };
  var rnd = Math.random, PI = Math.PI;
  function wrap(a) { return ((a + PI) % (2 * PI) + 2 * PI) % (2 * PI) - PI; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function mk(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  /* ---------- renderer / scene ---------- */
  var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  app.insertBefore(renderer.domElement, app.firstChild);
  var scene = new THREE.Scene();
  var HORIZON = 0xcfe2f7;
  scene.fog = new THREE.Fog(HORIZON, 140, 1100);
  var camera = new THREE.PerspectiveCamera(64, 1, 0.5, 4000);
  function resize() {
    var w = app.clientWidth || innerWidth, h = app.clientHeight || innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(app);
  window.addEventListener('resize', resize);
  resize();

  var SUN = new THREE.Vector3(-0.5, 0.35, 0.8).normalize();
  scene.add(new THREE.HemisphereLight(0xcfe4ff, 0xa89a80, 1.0));
  var sunL = new THREE.DirectionalLight(0xfff0d2, 1.15);
  sunL.position.copy(SUN).multiplyScalar(100);
  scene.add(sunL);

  /* ---------- sky ---------- */
  var sky = new THREE.Mesh(
    new THREE.SphereGeometry(1500, 32, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: { sun: { value: SUN } },
      vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: [
        'varying vec3 vDir; uniform vec3 sun;',
        'void main(){',
        ' vec3 d = normalize(vDir); float h = clamp(d.y,0.0,1.0);',
        ' vec3 zen = vec3(0.10,0.33,0.83), mid = vec3(0.42,0.69,1.0), hor = vec3(0.81,0.886,0.969);',
        ' vec3 c = mix(hor, mid, smoothstep(0.0,0.28,h));',
        ' c = mix(c, zen, smoothstep(0.22,0.95,h));',
        ' float s = max(dot(d, sun), 0.0);',
        ' c += vec3(1.0,0.72,0.38)*pow(s,5.0)*0.32 + vec3(1.0,0.82,0.52)*pow(s,40.0)*0.35 + vec3(1.0,0.95,0.8)*pow(s,300.0)*1.4;',
        ' if (d.y < 0.0) c = hor;',
        ' gl_FragColor = vec4(c,1.0); }'
      ].join('\n')
    })
  );
  sky.renderOrder = -10;
  scene.add(sky);

  function cloudTex() {
    var c = mk(256, 128), g = c.getContext('2d');
    for (var i = 0; i < 16; i++) {
      var x = 40 + rnd() * 176, y = 52 + rnd() * 26, r = 22 + rnd() * 26;
      var gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, 'rgba(255,255,255,0.95)');
      gr.addColorStop(0.6, 'rgba(255,255,255,0.55)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    var sh = g.createLinearGradient(0, 60, 0, 112);
    sh.addColorStop(0, 'rgba(150,175,215,0)'); sh.addColorStop(1, 'rgba(150,175,215,0.5)');
    g.globalCompositeOperation = 'source-atop'; g.fillStyle = sh; g.fillRect(0, 0, 256, 128);
    return new THREE.CanvasTexture(c);
  }
  var clouds = [], cTex = [cloudTex(), cloudTex(), cloudTex()];
  for (var i = 0; i < 26; i++) {
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: cTex[i % 3], transparent: true, depthWrite: false, fog: false, opacity: 0.55 + rnd() * 0.4 }));
    var sc = 220 + rnd() * 300;
    sp.scale.set(sc, sc * 0.5, 1);
    sp.userData = { a: rnd() * PI * 2, r: 650 + rnd() * 600, y: 70 + rnd() * 170, w: 0.0008 + rnd() * 0.0012 };
    sp.renderOrder = -5;
    scene.add(sp); clouds.push(sp);
  }

  /* ---------- ground ---------- */
  var maxAn = renderer.capabilities.getMaxAnisotropy();
  var sandC = mk(256, 256), sg = sandC.getContext('2d');
  sg.fillStyle = '#d6c39e'; sg.fillRect(0, 0, 256, 256);
  for (var i = 0; i < 5000; i++) { var v = 170 + rnd() * 50 | 0; sg.fillStyle = 'rgba(' + v + ',' + (v - 14) + ',' + (v - 46) + ',0.35)'; sg.fillRect(rnd() * 256, rnd() * 256, 2, 2); }
  var sandT = new THREE.CanvasTexture(sandC);
  sandT.wrapS = sandT.wrapT = THREE.RepeatWrapping; sandT.repeat.set(220, 220); sandT.anisotropy = maxAn;
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.MeshBasicMaterial({ map: sandT }));
  ground.rotation.x = -PI / 2; ground.position.y = -0.3;
  scene.add(ground);

  var R = 200;
  function asphalt() {
    var S = 2048, c = mk(S, S), g = c.getContext('2d'), C = S / 2, k = C / R;
    g.fillStyle = '#3a3e47'; g.fillRect(0, 0, S, S);
    for (var i = 0; i < 70000; i++) { var v = 44 + rnd() * 40 | 0; g.fillStyle = 'rgba(' + v + ',' + (v + 2) + ',' + (v + 8) + ',' + (rnd() * 0.5) + ')'; g.fillRect(rnd() * S, rnd() * S, 2, 2); }
    g.lineCap = 'butt';
    function ring(r, w, col, dash) { g.beginPath(); g.arc(C, C, r * k, 0, 7); g.lineWidth = w * k; g.strokeStyle = col; g.setLineDash(dash ? [dash[0] * k, dash[1] * k] : []); g.stroke(); }
    ring(193, 0.7, '#f2f2f2'); ring(110, 0.5, '#f5c542', [4, 4]); ring(60, 0.5, '#f5c542', [3, 3]); ring(150, 0.4, 'rgba(255,255,255,0.7)', [6, 10]);
    g.setLineDash([]);
    for (var a = 0; a < 8; a++) { g.save(); g.translate(C, C); g.rotate(a * PI / 4); g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(20 * k, -0.25 * k, 25 * k, 0.5 * k); g.restore(); }
    g.strokeStyle = 'rgba(8,8,10,0.28)'; g.lineWidth = 3;
    for (var i = 0; i < 26; i++) { var rr = (40 + rnd() * 140) * k, a0 = rnd() * 7; g.beginPath(); g.arc(C, C, rr, a0, a0 + 0.4 + rnd() * 1.4); g.stroke(); }
    var t = new THREE.CanvasTexture(c); t.anisotropy = maxAn; return t;
  }
  var disc = new THREE.Mesh(new THREE.CircleGeometry(R, 96), new THREE.MeshBasicMaterial({ map: asphalt(), polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
  disc.rotation.x = -PI / 2; scene.add(disc);

  /* barrier ring */
  var bGeo = new THREE.BoxGeometry(13, 1.2, 2.2);
  var bRed = new THREE.MeshLambertMaterial({ color: 0xd8344a }), bWhite = new THREE.MeshLambertMaterial({ color: 0xf1f1f1 });
  for (var i = 0; i < 100; i++) {
    var th = i / 100 * PI * 2, b = new THREE.Mesh(bGeo, i % 2 ? bRed : bWhite);
    b.position.set(Math.cos(th) * (R + 1), 0.6, Math.sin(th) * (R + 1));
    b.rotation.y = -(th + PI / 2);
    scene.add(b);
  }

  /* mountains */
  var mMat = new THREE.MeshLambertMaterial({ color: 0x7d93b6, flatShading: true });
  for (var i = 0; i < 28; i++) {
    var h = 90 + rnd() * 190, rad = 120 + rnd() * 160;
    var m = new THREE.Mesh(new THREE.ConeGeometry(rad, h, 5 + (rnd() * 3 | 0)), mMat);
    var an = i / 28 * PI * 2 + rnd() * 0.2, dd = 760 + rnd() * 240;
    m.position.set(Math.cos(an) * dd, h / 2 - 5, Math.sin(an) * dd);
    m.rotation.y = rnd() * 3;
    scene.add(m);
  }

  /* ---------- cones ---------- */
  var coneGeo = new THREE.ConeGeometry(0.42, 1.1, 14); coneGeo.translate(0, 0.62, 0);
  var baseGeo = new THREE.BoxGeometry(1, 0.08, 1); baseGeo.translate(0, 0.04, 0);
  var bandGeo = new THREE.CylinderGeometry(0.25, 0.3, 0.2, 14); bandGeo.translate(0, 0.62, 0);
  var cOr = new THREE.MeshLambertMaterial({ color: 0xff6a1f }), cWh = new THREE.MeshLambertMaterial({ color: 0xffffff }), cBs = new THREE.MeshLambertMaterial({ color: 0x2a2d35 });
  var cones = [];
  function addCone(x, z) {
    var g = new THREE.Group();
    g.add(new THREE.Mesh(coneGeo, cOr), new THREE.Mesh(bandGeo, cWh), new THREE.Mesh(baseGeo, cBs));
    scene.add(g);
    cones.push({ m: g, hx: x, hz: z, x: x, z: z, vx: 0, vz: 0, cd: 0, down: false });
  }
  for (var i = 0; i < 28; i++) { var t = i / 28 * PI * 2; addCone(Math.cos(t) * 110, Math.sin(t) * 110); }
  for (var i = 0; i < 16; i++) { var t = i / 16 * PI * 2; addCone(Math.cos(t) * 60, Math.sin(t) * 60); }
  for (var i = 0; i < 8; i++) addCone(-150 + i * 14, 150 - (i % 2) * 6);
  function placeCones() {
    cones.forEach(function (c) { c.x = c.hx; c.z = c.hz; c.vx = c.vz = 0; c.cd = 0; c.down = false; c.m.rotation.set(0, 0, 0); c.m.position.set(c.x, 0, c.z); });
  }
  placeCones();

  /* ---------- car ---------- */
  var COLORS = [0xff4d5e, 0x19c7ff, 0xffc83d, 0x7be35a, 0xb06bff, 0xf2f2f2];
  var colorIdx = 0;
  var paint = new THREE.MeshStandardMaterial({ color: COLORS[0], metalness: 0.35, roughness: 0.35 });
  var glass = new THREE.MeshStandardMaterial({ color: 0x18202e, metalness: 0.6, roughness: 0.15 });
  var dark = new THREE.MeshLambertMaterial({ color: 0x15171c });
  var white = new THREE.MeshLambertMaterial({ color: 0xf4f4f4 });
  var rim = new THREE.MeshStandardMaterial({ color: 0xcfd6e0, metalness: 0.8, roughness: 0.3 });
  var hl = new THREE.MeshBasicMaterial({ color: 0xfff2b8 }), tl = new THREE.MeshBasicMaterial({ color: 0xff2a3a });
  function box(w, h, d, x, y, z, mat, parent) { var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); parent.add(m); return m; }

  var car3 = new THREE.Group(), body = new THREE.Group();
  car3.add(body);
  box(1.9, 0.55, 4.2, 0, 0.62, 0, paint, body);
  box(0.34, 0.02, 3.9, 0, 0.9, 0, white, body);
  box(1.55, 0.46, 1.9, 0, 1.12, -0.25, glass, body);
  box(1.6, 0.07, 1.65, 0, 1.38, -0.25, paint, body);
  box(1.96, 0.28, 0.3, 0, 0.42, 2.05, dark, body);
  box(1.96, 0.28, 0.3, 0, 0.42, -2.05, dark, body);
  box(0.4, 0.14, 0.06, 0.7, 0.72, 2.12, hl, body); box(0.4, 0.14, 0.06, -0.7, 0.72, 2.12, hl, body);
  box(0.5, 0.14, 0.06, 0.65, 0.74, -2.12, tl, body); box(0.5, 0.14, 0.06, -0.65, 0.74, -2.12, tl, body);
  box(0.08, 0.35, 0.08, 0.7, 1.05, -1.95, dark, body); box(0.08, 0.35, 0.08, -0.7, 1.05, -1.95, dark, body);
  box(1.95, 0.07, 0.5, 0, 1.25, -2.0, paint, body);
  var wheels = [];
  var tireG = new THREE.CylinderGeometry(0.38, 0.38, 0.3, 18); tireG.rotateZ(PI / 2);
  var rimG = new THREE.CylinderGeometry(0.22, 0.22, 0.32, 10); rimG.rotateZ(PI / 2);
  [[1, 1.35], [-1, 1.35], [1, -1.35], [-1, -1.35]].forEach(function (p, i) {
    var piv = new THREE.Group(); piv.position.set(p[0] * 0.98, 0.38, p[1]);
    var sp = new THREE.Group(); sp.add(new THREE.Mesh(tireG, dark), new THREE.Mesh(rimG, rim)); piv.add(sp);
    car3.add(piv); wheels.push({ piv: piv, spin: sp, front: i < 2 });
  });
  var shC = mk(64, 64), sgx = shC.getContext('2d'), sgr = sgx.createRadialGradient(32, 32, 0, 32, 32, 32);
  sgr.addColorStop(0, 'rgba(0,0,0,0.55)'); sgr.addColorStop(1, 'rgba(0,0,0,0)'); sgx.fillStyle = sgr; sgx.fillRect(0, 0, 64, 64);
  var blob = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shC), transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }));
  blob.rotation.x = -PI / 2; blob.scale.set(3.4, 6.2, 1); blob.position.y = 0.03;
  car3.add(blob);
  scene.add(car3);

  /* ---------- skid marks ---------- */
  var MAXSEG = 1800, skidPos = new Float32Array(MAXSEG * 18);
  var skidAttr = new THREE.BufferAttribute(skidPos, 3); skidAttr.setUsage(THREE.DynamicDrawUsage);
  var skidGeo = new THREE.BufferGeometry(); skidGeo.setAttribute('position', skidAttr);
  var skid = new THREE.Mesh(skidGeo, new THREE.MeshBasicMaterial({ color: 0x0a0a0c, transparent: true, opacity: 0.5, depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
  skid.frustumCulled = false; scene.add(skid);
  var skidIdx = 0, lastSk = [null, null];
  function addSkid(w, x, z, sx, sz, on) {
    if (!on) { lastSk[w] = null; return; }
    var p = lastSk[w];
    if (!p) { lastSk[w] = { x: x, z: z, sx: sx, sz: sz }; return; }
    var dx = x - p.x, dz = z - p.z;
    if (dx * dx + dz * dz < 0.36) return;
    var o = skidIdx * 18, y = 0.03;
    var q = [p.x + p.sx, p.z + p.sz, p.x - p.sx, p.z - p.sz, x + sx, z + sz, x - sx, z - sz];
    var idx = [0, 1, 2, 1, 3, 2];
    for (var i = 0; i < 6; i++) { skidPos[o + i * 3] = q[idx[i] * 2]; skidPos[o + i * 3 + 1] = y; skidPos[o + i * 3 + 2] = q[idx[i] * 2 + 1]; }
    lastSk[w] = { x: x, z: z, sx: sx, sz: sz };
    skidIdx = (skidIdx + 1) % MAXSEG; skidAttr.needsUpdate = true;
  }

  /* ---------- smoke ---------- */
  var smC = mk(64, 64), smg = smC.getContext('2d'), smr = smg.createRadialGradient(32, 32, 0, 32, 32, 32);
  smr.addColorStop(0, 'rgba(255,255,255,0.9)'); smr.addColorStop(0.5, 'rgba(255,255,255,0.4)'); smr.addColorStop(1, 'rgba(255,255,255,0)');
  smg.fillStyle = smr; smg.fillRect(0, 0, 64, 64);
  var smT = new THREE.CanvasTexture(smC), smoke = [];
  for (var i = 0; i < 90; i++) {
    var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: smT, transparent: true, depthWrite: false, opacity: 0, color: 0xf0f0f0 }));
    s.visible = false; scene.add(s); smoke.push({ s: s, life: 0, max: 1, vx: 0, vy: 0, vz: 0 });
  }
  function spawnSmoke(x, z, vx, vz) {
    for (var i = 0; i < smoke.length; i++) {
      var p = smoke[i];
      if (p.life <= 0) {
        p.life = p.max = 0.9 + rnd() * 0.6; p.vx = vx * 0.3 + (rnd() - 0.5) * 2; p.vy = 0.8 + rnd(); p.vz = vz * 0.3 + (rnd() - 0.5) * 2;
        p.s.position.set(x, 0.4, z); p.s.visible = true; return;
      }
    }
  }

  /* ---------- state ---------- */
  var car = { x: 0, z: -85, h: PI / 2, vx: 0, vz: 0, yaw: 0, steer: 0, grip: 5.5, roll: 0, pitch: 0 };
  var ctl = { left: false, right: false, gas: false, brake: false, hand: false };
  var keys = {};
  var autoGas = false, muted = false, playing = false;
  var chain = 0, driftT = 0, gapT = 0, total = 0, best = 0, shake = 0, wheelRot = 0;
  try { best = parseInt(localStorage.getItem('skydrift-best') || '0', 10) || 0; } catch (e) {}
  var acc = [0, 0], camAng = car.h, hitCd = 0;

  var elSpd = $('#spd'), elScore = $('#score'), elBest = $('#best'), elChain = $('#chain'), elMult = $('#mult'), elAng = $('#angbar'), elBox = $('#chainBox'), elToast = $('#toast');
  var cache = {};
  function setTxt(k, el, v) { if (cache[k] !== v) { cache[k] = v; el.textContent = v; } }
  function fmt(n) { return Math.round(n).toLocaleString('ru-RU'); }
  elBest.textContent = fmt(best);
  function toast(txt, cls) {
    elToast.textContent = txt; elToast.className = cls; void elToast.offsetWidth; elToast.className = cls + ' show';
  }

  function resetCar() {
    car.x = 0; car.z = -85; car.h = PI / 2; car.vx = car.vz = 0; car.yaw = 0; car.steer = 0; camAng = car.h;
    chain = 0; driftT = 0; gapT = 0; lastSk[0] = lastSk[1] = null;
    skidPos.fill(0); skidAttr.needsUpdate = true; skidIdx = 0;
    placeCones(); updCam(0.016, true);
  }
  function crash(msg) {
    if (chain > 20) toast(msg, 'crash');
    chain = 0; driftT = 0; gapT = 0;
  }
  function bank() {
    if (chain > 1) {
      total += chain; toast('+' + fmt(chain), 'bank');
      if (total > best) { best = total; try { localStorage.setItem('skydrift-best', String(Math.round(best))); } catch (e) {} }
    }
    chain = 0; driftT = 0;
  }

  /* ---------- audio ---------- */
  var ac = null, engG, nzG, eng;
  function initAudio() {
    if (ac) { try { ac.resume(); } catch (e) {} return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      eng = ac.createOscillator(); eng.type = 'sawtooth';
      var f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 650;
      engG = ac.createGain(); engG.gain.value = 0;
      eng.connect(f); f.connect(engG); engG.connect(ac.destination); eng.start();
      var buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1;
      var src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 2.5;
      nzG = ac.createGain(); nzG.gain.value = 0;
      src.connect(bp); bp.connect(nzG); nzG.connect(ac.destination); src.start();
    } catch (e) { ac = null; }
  }
  function updAudio(speed, thr, slip) {
    if (!ac) return;
    var t = ac.currentTime;
    eng.frequency.setTargetAtTime(46 + speed * 3.4 + thr * 16, t, 0.06);
    engG.gain.setTargetAtTime(muted || !playing ? 0 : 0.05 + thr * 0.03, t, 0.1);
    nzG.gain.setTargetAtTime(muted || !playing ? 0 : slip * 0.09, t, 0.08);
  }
  document.addEventListener('visibilitychange', function () {
    if (!ac) return;
    try { document.hidden ? ac.suspend() : ac.resume(); } catch (e) {}
    if (document.hidden) { for (var k in ctl) ctl[k] = false; keys = {}; syncPads(); }
  });

  /* ---------- input ---------- */
  var padEls = document.querySelectorAll('.pad');
  function syncPads() { padEls.forEach(function (b) { b.classList.toggle('on', !!ctl[b.dataset.k]); }); }
  padEls.forEach(function (b) {
    var k = b.dataset.k;
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (x) {} ctl[k] = true; syncPads(); });
    var up = function () { ctl[k] = false; syncPads(); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {
    keys[e.code] = true;
    if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
    if (e.code === 'KeyR') resetCar();
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });
  function inp() {
    return {
      left: ctl.left || keys.ArrowLeft || keys.KeyA,
      right: ctl.right || keys.ArrowRight || keys.KeyD,
      gas: ctl.gas || keys.ArrowUp || keys.KeyW,
      brake: ctl.brake || keys.ArrowDown || keys.KeyS,
      hand: ctl.hand || keys.Space || keys.ShiftLeft

  }

  function toggle(btn, fn) { btn.addEventListener('click', fn); }
  toggle($('#tSound'), function () { muted = !muted; this.setAttribute('aria-pressed', String(!muted)); });
  toggle($('#tAuto'), function () { autoGas = !autoGas; this.setAttribute('aria-pressed', String(autoGas)); });
  toggle($('#tColor'), function () { colorIdx = (colorIdx + 1) % COLORS.length; paint.color.setHex(COLORS[colorIdx]); });
  toggle($('#tReset'), resetCar);
  $('#go').addEventListener('click', function () {
    $('#start').hidden = true; playing = true; initAudio();
  });

  /* ---------- camera ---------- */
  function updCam(dt, snap) {
    var speed = Math.hypot(car.vx, car.vz), target = car.h;
    if (speed > 4) target = car.h + wrap(Math.atan2(car.vx, car.vz) - car.h) * 0.4 * Math.min(1, (speed - 4) / 8);
    camAng = snap ? target : camAng + wrap(target - camAng) * (1 - Math.exp(-4 * dt));
    var dist = 9.2 + speed * 0.04, hgt = 3.6 + speed * 0.02;
    var tx = car.x - Math.sin(camAng) * dist, tz = car.z - Math.cos(camAng) * dist;
    var k = snap ? 1 : 1 - Math.exp(-9 * dt);

    camera.position.y += (hgt - camera.position.y) * k;
    camera.position.z += (tz - camera.position.z) * k;
    if (shake > 0.01) { camera.position.x += (rnd() - 0.5) * shake; camera.position.y += (rnd() - 0.5) * shake * 0.6; shake *= Math.exp(-6 * dt); }
    camera.lookAt(car.x + Math.sin(camAng) * 5, 1.5, car.z + Math.cos(camAng) * 5);
    var fov = 62 + Math.min(speed, 50) * 0.4;
    if (Math.abs(camera.fov - fov) > 0.05) { camera.fov += (fov - camera.fov) * Math.min(1, dt * 4 + (snap ? 1 : 0)); camera.updateProjectionMatrix(); }
    sky.position.copy(camera.position);
  }
  camera.position.set(car.x - 9, 3.6, car.z);

  /* ---------- physics ---------- */
  var angNow = 0, driftOn = false;
  function step(dt) {
    var I = inp(), thr = (I.gas || (autoGas && !I.brake)) ? 1 : 0, hand = !!I.hand;
    var st = (I.left ? 1 : 0) - (I.right ? 1 : 0);
    car.steer += (st - car.steer) * Math.min(1, dt * (st === 0 ? 9 : 6));

    var fx = Math.sin(car.h), fz = Math.cos(car.h), lx = Math.cos(car.h), lz = -Math.sin(car.h);
    var vf = car.vx * fx + car.vz * fz, vl = car.vx * lx + car.vz * lz;

    vf += 22 * thr * (hand ? 0.65 : 1) * dt;
    vf -= vf * 0.5 * dt;
    if (!thr && !I.brake) vf -= Math.sign(vf) * Math.min(Math.abs(vf), 2.5 * dt);
    if (I.brake) { if (vf > 0.5) vf = Math.max(0, vf - 34 * dt); else vf = Math.max(-14, vf - 12 * dt); }
    if (hand) vf *= Math.exp(-0.55 * dt);

    car.grip += (gTarget - car.grip) * Math.min(1, dt * 6);
    vl *= Math.exp(-car.grip * dt);

    car.vx = fx * vf + lx * vl; car.vz = fz * vf + lz * vl;

    var speed = Math.hypot(car.vx, car.vz);
    var auth = Math.min(1, speed / 5) * (vf >= -0.5 ? 1 : -1);
    var yawT = car.steer * (hand ? 2.8 : 2.0) * auth / (1 + speed / 70);
    car.yaw += (yawT - car.yaw) * Math.min(1, dt * (hand ? 5 : 9));
    car.h += car.yaw * dt;
    car.x += car.vx * dt; car.z += car.vz * dt;

    /* wall */
    var d = Math.hypot(car.x, car.z), lim = R - 2.2;
    if (d > lim) {
      var nx = car.x / d, nz = car.z / d, vn = car.vx * nx + car.vz * nz;
      car.x = nx * lim; car.z = nz * lim;
      if (vn > 0) {
        car.vx -= 1.55 * vn * nx; car.vz -= 1.55 * vn * nz;
        if (vn > 4 && hitCd <= 0) { crash('Стена!'); shake = Math.min(0.9, vn * 0.05); hitCd = 0.5; }
      }
    }
    /* cones */
    for (var i = 0; i < cones.length; i++) {
      var c = cones[i];
      if (c.cd > 0) c.cd -= dt;
      if (c.vx * c.vx + c.vz * c.vz > 0.04) { c.x += c.vx * dt; c.z += c.vz * dt; var f = Math.exp(-1.6 * dt); c.vx *= f; c.vz *= f; c.m.position.set(c.x, 0, c.z); }
      var dx = c.x - car.x, dz = c.z - car.z, dd = dx * dx + dz * dz;
      if (dd < 3.1 && c.cd <= 0) {
        var sp = Math.hypot(car.vx, car.vz);
        if (sp > 2.5) {
          var L = Math.sqrt(dd) || 1;
          c.vx = car.vx * 1.15 + dx / L * 4; c.vz = car.vz * 1.15 + dz / L * 4; c.cd = 0.6;
          if (!c.down) { c.down = true; c.m.rotation.set(rnd() - 0.5, rnd() * 6, 1.45); c.m.position.y = 0.38; }
          car.vx *= 0.93; car.vz *= 0.93; shake = Math.max(shake, 0.25);
          if (sp > 6) crash('Конус!');
        }
      }
    }
    if (hitCd > 0) hitCd -= dt;

    /* drift scoring */
    speed = Math.hypot(car.vx, car.vz);
    var ang = Math.abs(wrap(Math.atan2(car.vx, car.vz) - car.h));
    angNow = speed > 3 ? ang : 0;
    driftOn = speed > 8 && ang > 0.3 && ang < 2.3;
    if (driftOn) {
      driftT += dt; gapT = 0;
      var mult = 1 + Math.min(driftT * 0.5, 9);
      chain += dt * speed * Math.min(ang, 1.3) * 9 * mult;
    } else if (chain > 0) {
      gapT += dt; if (gapT > 0.9) bank();
    }

    /* visuals */
    car3.position.set(car.x, 0, car.z); car3.rotation.y = car.h;
    var rollT = clamp(car.yaw * speed * 0.0042, -0.14, 0.14);
    car.roll += (rollT - car.roll) * Math.min(1, dt * 8);
    var pitchT = clamp(-(thr - (I.brake ? 1 : 0)) * 0.025 * Math.min(1, speed / 15), -0.05, 0.05);
    car.pitch += (pitchT - car.pitch) * Math.min(1, dt * 6);
    body.rotation.z = car.roll; body.rotation.x = car.pitch;
    wheelRot += vf * dt / 0.38;
    wheels.forEach(function (w) { w.spin.rotation.x = wheelRot; if (w.front) w.piv.rotation.y = car.steer * 0.45; });

    var slide = driftOn || (hand && speed > 6);
    var rx = [lx * 0.85, -lx * 0.85], rz = [lz * 0.85, -lz * 0.85];
    for (var w = 0; w < 2; w++) {
      var wx = car.x - fx * 1.35 + rx[w], wz = car.z - fz * 1.35 + rz[w];
      addSkid(w, wx, wz, lx * 0.17, lz * 0.17, slide);
      if (slide) { acc[w] += dt * (30 + speed); while (acc[w] > 1) { acc[w] -= 1; spawnSmoke(wx, wz, car.vx, car.vz); } }
    }
    updAudio(speed, thr, slide ? Math.min(1, ang * 1.5) : 0);
  }

  /* ---------- HUD ---------- */
  function hud() {
    var speed = Math.hypot(car.vx, car.vz);
    setTxt('spd', elSpd, String(Math.round(speed * 3.6)));
    setTxt('score', elScore, fmt(total));
    setTxt('best', elBest, fmt(best));
    var on = chain > 1;
    elBox.classList.toggle('on', on);
    if (on) {
      setTxt('chain', elChain, fmt(chain));
      setTxt('mult', elMult, 'x' + (1 + Math.min(driftT * 0.5, 9)).toFixed(1));
      elAng.style.width = Math.round(clamp(angNow / 1.3, 0, 1) * 100) + '%';
    }
  }

  /* ---------- loop ---------- */
  var tPrev = performance.now(), idle = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.033, (now - tPrev) / 1000); tPrev = now;
    if (playing) step(dt);
    else { idle += dt; car3.position.set(car.x, 0, car.z); car3.rotation.y = car.h; }
    for (var i = 0; i < smoke.length; i++) {
      var p = smoke[i]; if (p.life <= 0) continue;
      p.life -= dt;
      if (p.life <= 0) { p.s.visible = false; continue; }
      var t = 1 - p.life / p.max;
      p.s.position.x += p.vx * dt; p.s.position.y += p.vy * dt; p.s.position.z += p.vz * dt;
      p.vx *= 0.97; p.vz *= 0.97;
      var sc = 1.5 + t * 5; p.s.scale.set(sc, sc, 1);
      p.s.material.opacity = (1 - t) * 0.5;
    }
    for (var j = 0; j < clouds.length; j++) {
      var cl = clouds[j], u = cl.userData; u.a += u.w * dt * 4;
      cl.position.set(Math.cos(u.a) * u.r, u.y, Math.sin(u.a) * u.r);
    }
    updCam(dt, false);
    if (playing) hud();
    renderer.render(scene, camera);
  }
  updCam(0.016, true);
  requestAnimationFrame(frame);
})();
</script>
